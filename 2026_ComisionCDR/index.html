<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuadrante CDR 2026</title>
<style>
:root{--v:#2e7d32;--vl:#4caf50;--bg:#f5f5f0;--w:#fff;--tx:#1a1a1a;--gr:#757575}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
header{background:var(--v);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:99;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{font-size:1rem;font-weight:700;line-height:1.2}
header p{font-size:.72rem;opacity:.85}
.bk{background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;padding:4px 8px;border-radius:6px;flex-shrink:0}
.bk:hover{background:rgba(255,255,255,.2)}
/* LANDING */
#ld{padding:18px 14px}
.lt{text-align:center;margin-bottom:18px}
.lt h2{font-size:1.3rem;color:var(--v)}
.lt p{color:var(--gr);margin-top:4px;font-size:.88rem}
.sb{max-width:400px;margin:0 auto 14px;display:flex;align-items:center;background:var(--w);border:1.5px solid #ddd;border-radius:10px;padding:7px 11px;gap:7px}
.sb input{border:none;outline:none;font-size:.93rem;width:100%;background:none}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:9px;max-width:540px;margin:0 auto}
.pc{background:var(--w);border:2px solid #e0e0e0;border-radius:11px;padding:11px 7px;text-align:center;cursor:pointer;transition:all .15s;font-size:.86rem;font-weight:600}
.pc:hover{border-color:var(--vl);background:#f1f8e9;transform:translateY(-2px);box-shadow:0 4px 10px rgba(46,125,50,.15)}
.pc.hid{display:none}
.pc .ic{font-size:1.3rem;display:block;margin-bottom:3px}
.pc .cn{font-size:.7rem;color:#888;font-weight:400}
.ld-btns{display:flex;justify-content:center;gap:10px;padding:18px 0 6px;flex-wrap:wrap}
.ld-btns button{background:none;border:1.5px solid #bbb;border-radius:8px;padding:7px 16px;color:var(--gr);cursor:pointer;font-size:.8rem}
.ld-btns button:hover{border-color:var(--v);color:var(--v)}
/* VISTA PERSONA */
#vp{display:none}
.ph{padding:14px 16px;background:linear-gradient(135deg,#e8f5e9,#f9fbe7);border-bottom:1px solid #c8e6c9}
.ph-n{font-size:1.4rem;font-weight:700;color:var(--v)}
.ph-s{display:flex;gap:14px;margin-top:5px;font-size:.76rem;color:var(--gr);flex-wrap:wrap}
/* FILTROS */
.fi{padding:9px 13px;display:flex;gap:6px;overflow-x:auto;background:var(--w);border-bottom:1px solid #e0e0e0;scrollbar-width:none}
.fi::-webkit-scrollbar{display:none}
.fb{white-space:nowrap;padding:5px 12px;border-radius:20px;border:1.5px solid #e0e0e0;background:var(--w);font-size:.76rem;cursor:pointer;font-weight:500;transition:all .15s}
.fb.on{background:var(--v);border-color:var(--v);color:#fff}
/* TIMELINE */
.tl{padding:13px}
.dg{margin-bottom:16px}
.dh{margin-bottom:8px}
.df{display:inline-block;background:var(--v);color:#fff;border-radius:7px;padding:3px 10px;font-size:.78rem;font-weight:700}
.tc{background:var(--w);border-radius:9px;padding:10px 12px;margin-bottom:6px;border-left:4px solid #ccc;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.th2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tn{font-weight:600;font-size:.9rem;line-height:1.3}
.hr{font-size:.73rem;color:var(--gr);white-space:nowrap;background:#f0f0f0;padding:2px 7px;border-radius:10px;flex-shrink:0}
.tm{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.bd{font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.3px}
.co{font-size:.73rem;color:var(--gr)}
.emp{text-align:center;padding:36px 20px;color:var(--gr)}
.emp span{font-size:2rem;display:block;margin-bottom:10px}
/* Colores tipo */
.tBARRA{border-left-color:#1565c0}.tBARRA .bd{background:#e3f2fd;color:#1565c0}
.tCENA{border-left-color:#6a1b9a}.tCENA .bd{background:#f3e5f5;color:#6a1b9a}
.tNEVERA{border-left-color:#00838f}.tNEVERA .bd{background:#e0f7fa;color:#00838f}
.tBONOS{border-left-color:#e65100}.tBONOS .bd{background:#fff3e0;color:#e65100}
.tBINGO{border-left-color:#f57f17}.tBINGO .bd{background:#fffde7;color:#f57f17}
.tNINOS{border-left-color:#388e3c}.tNINOS .bd{background:#e8f5e9;color:#2e7d32}
.tSARDINAS{border-left-color:#4e342e}.tSARDINAS .bd{background:#efebe9;color:#4e342e}
.tPAN{border-left-color:#e65100}.tPAN .bd{background:#fff8e1;color:#bf360c}
.tVERBENA{border-left-color:#c62828}.tVERBENA .bd{background:#ffebee;color:#c62828}
.tOTRA{border-left-color:#616161}.tOTRA .bd{background:#f5f5f5;color:#424242}
.tdefault{border-left-color:#9e9e9e}.tdefault .bd{background:#f5f5f5;color:#616161}
/* MATRICES */
#vm{display:none}
.mat-tabs{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;background:var(--w);border-bottom:1px solid #e0e0e0;scrollbar-width:none}
.mat-tabs::-webkit-scrollbar{display:none}
.mt-btn{white-space:nowrap;padding:6px 14px;border-radius:20px;border:1.5px solid #e0e0e0;background:var(--w);font-size:.78rem;cursor:pointer;font-weight:600;transition:all .15s}
.mt-btn.on{background:var(--v);border-color:var(--v);color:#fff}
.mat-content{padding:14px}
.mat-section{display:none}
.mat-section.show{display:block}
.mat-title{font-size:1rem;font-weight:700;color:var(--v);margin-bottom:4px}
.mat-sub{font-size:.78rem;color:var(--gr);margin-bottom:12px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
table{border-collapse:collapse;width:100%;min-width:340px;background:var(--w);font-size:.78rem}
th{background:var(--v);color:#fff;padding:7px 10px;text-align:center;white-space:nowrap;font-weight:700;font-size:.74rem}
th.name-col{text-align:left;min-width:90px}
td{padding:6px 10px;text-align:center;border-bottom:1px solid #f0f0f0;white-space:nowrap}
td.name-col{text-align:left;font-weight:600;font-size:.8rem;padding-left:12px}
tr.grupo-row td{background:#f9fbe7;font-style:italic;font-size:.72rem;color:#555;text-align:left;padding:4px 12px;border-bottom:1px solid #e8f5e9}
tr:hover td{background:#f9fbe7}
tr.grupo-row:hover td{background:#f9fbe7}
.cell-t1{background:#e3f2fd;color:#0d47a1;font-weight:700;border-radius:4px}
.cell-t2{background:#e8eaf6;color:#283593;font-weight:700;border-radius:4px}
.cell-t3{background:#f3e5f5;color:#4a148c;font-weight:700;border-radius:4px}
.cell-t4{background:#fff8e1;color:#e65100;font-weight:700;border-radius:4px}
.cell-t5{background:#fce4ec;color:#880e4f;font-weight:700;border-radius:4px}
.cell-t6,.cell-tlim{background:#ffebee;color:#b71c1c;font-weight:700;border-radius:4px}
.cell-ok{background:#e8f5e9;color:#1b5e20;font-weight:700;border-radius:4px}
.cell-prev{background:#e0f7fa;color:#006064;font-weight:600;border-radius:4px;font-size:.7rem}
.cell-sub{background:#fff8e1;color:#e65100;font-weight:700;border-radius:4px}
.cell-no{color:#bbb}
.cell-hora{background:#e8eaf6;color:#283593;font-weight:700;border-radius:4px;font-size:.72rem}
@media(max-width:370px){.pg{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

function showMat(which, btn){
  document.querySelectorAll('.mt-btn').forEach(function(b){b.classList.remove('on');});

  if(which==='barra')   renderMatBarra(c);
  if(which==='neveras') renderMatNeveras(c);
  if(which==='cenas')   renderMatCenas(c);
  if(which==='pan')     renderMatPan(c);
}

function cellClass(v){
  if(!v||v==='—') return 'cell-no';
  if(v.startsWith('T1')) return 'cell-t1';
  if(v.startsWith('T2')) return 'cell-t2';
  if(v.startsWith('T3')) return 'cell-t3';
  if(v.startsWith('T4')) return 'cell-t4';
  if(v.startsWith('T5')) return 'cell-t5';
  if(v.startsWith('T6')) return 'cell-t6';
  if(v==='PREV') return 'cell-prev';
  if(v==='✓'||v==='✓') return 'cell-ok';
  if(v==='Subasta') return 'cell-sub';
  if(v==='?') return 'cell-t2';
  if(/^\d{2}-\d{2}$/.test(v)) return 'cell-hora';
  if(v==='Contar') return 'cell-ok';
  return '';
}
function cellText(v){
  if(!v||v==='—') return '—';
  if(v==='PREV') return 'Día previo';
  return v;
}

function buildTable(dias, grupos, c){
  var wrap=document.createElement('div'); wrap.className='tbl-wrap';
  var t=document.createElement('table');
  var thead=document.createElement('thead');
  var hrow=document.createElement('tr');
  var th0=document.createElement('th'); th0.className='name-col'; th0.textContent='Persona';
  hrow.appendChild(th0);
  dias.forEach(function(d){
    var th=document.createElement('th'); th.innerHTML=d.replace('\n','<br>'); hrow.appendChild(th);
  });
  thead.appendChild(hrow); t.appendChild(thead);
  var tbody=document.createElement('tbody');
  grupos.forEach(function(grupo){
    var gr=document.createElement('tr'); gr.className='grupo-row';
    var grtd=document.createElement('td'); grtd.colSpan=dias.length+1; grtd.textContent=grupo.g;
    gr.appendChild(grtd); tbody.appendChild(gr);
    grupo.filas.forEach(function(fila){
      var row=document.createElement('tr');
      var td0=document.createElement('td'); td0.className='name-col'; td0.textContent=fila.n;
      row.appendChild(td0);
      fila.v.forEach(function(v){
        var td=document.createElement('td');
        var cl=cellClass(v);
        if(cl) td.innerHTML='<span class="'+cl+'">'+cellText(v)+'</span>';
        else td.textContent=cellText(v);
        row.appendChild(td);
      });
      tbody.appendChild(row);
    });
  });
  t.appendChild(tbody); wrap.appendChild(t); c.appendChild(wrap);
}

function renderFi(tipos){
  const c=document.getElementById('fi'); c.innerHTML='';
  function mk(lbl,val){
    const b=document.createElement('button');
    b.className='fb'+(FT===val?' on':''); b.textContent=lbl;
    b.onclick=(function(v,ts){return function(){FT=v;renderFi(ts);renderTL(PID);};})(val,tipos);
    c.appendChild(b);
  }
  mk('Todas','ALL');
  tipos.forEach(function(tp){mk(TL[tp]||tp,tp);});
}

function renderTL(id){
  const c=document.getElementById('tl'); c.innerHTML='';
  var raw=[];
  if(id==="ALL"){
    var seen={};
    Object.entries(DATOS).forEach(function(kv){
      kv[1].forEach(function(t){
        var key=t.f+'||'+t.t;
        if(!seen[key]){seen[key]=true;raw.push(t);}
      });
    });
  } else {
    raw=(DATOS[id]||[]).slice();
  }
  if(FT!=='ALL') raw=raw.filter(function(t){return t.tp===FT;});
  if(!raw.length){
    c.innerHTML='<div class="emp"><span>😴</span>Sin tareas con este filtro</div>';
    return;
  }
  var grupos={};
  raw.forEach(function(t){if(!grupos[t.f])grupos[t.f]=[];grupos[t.f].push(t);});
  ORDER.forEach(function(fecha){
    if(!grupos[fecha])return;
    var dg=document.createElement('div'); dg.className='dg';
    var dh=document.createElement('div'); dh.className='dh';
    var df=document.createElement('span'); df.className='df'; df.textContent=FL[fecha]||fecha;
    dh.appendChild(df); dg.appendChild(dh);
    grupos[fecha].forEach(function(t){
      var tc=document.createElement('div');
      tc.className='tc t'+(t.tp||'default');
      var coTxt='';
      if(id!=="ALL"){
        var myN=(META[id]||{n:id}).n.split(' ')[0].toLowerCase();
        var parts=t.p?t.p.split(/[,·]/).map(function(s){return s.trim();}).filter(function(s){
          return s&&s!=='TODOS disponibles'&&s!=='TODOS'&&s!=='TODOS (opcional)';
        }):[];
        var co=parts.filter(function(n){return n.toLowerCase().indexOf(myN)<0;});
        if(co.length) coTxt='Con: '+co.join(', ');
      } else {
        if(t.p&&t.p!=='TODOS disponibles'&&t.p!=='TODOS') coTxt=t.p;
      }
      var hora=t.h&&t.h!=='—'&&t.h?'<span class="hr">'+t.h+'</span>':'';
      var badge=TL[t.tp]||t.tp||'Tarea';
      tc.innerHTML='<div class="th2"><span class="tn">'+t.t+'</span>'+hora+'</div>'+
        '<div class="tm"><span class="bd">'+badge+'</span>'+(coTxt?'<span class="co">'+coTxt+'</span>':'')+'</div>';
      dg.appendChild(tc);
    });
    c.appendChild(dg);
  });
}
